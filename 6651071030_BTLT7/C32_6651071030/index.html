<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Display a random image.</title>
    <style type="text/css">
        body { margin-top: 30px; }
        #image-container { margin-top: 15px; }
    </style>
</head>
<body>

    <div>
        <button id="jsstyle" onclick="display_random_image();">Show Image</button>
    </div>

    <!-- Khối div dùng để chứa ảnh hiển thị bên dưới nút -->
    <div id="image-container"></div>

    <script>
        function display_random_image() {
            var images = [
                {
                    src: "http://farm4.staticflickr.com/3691/11268502654_f28f05966c_m.jpg",
                    width: "240",
                    height: "160"
                },
                {
                    src: "http://farm1.staticflickr.com/33/45336904_1aef569b30_n.jpg",
                    width: "320",
                    height: "195"
                },
                {
                    src: "http://farm6.staticflickr.com/5211/5384592886_80a512e2c9.jpg",
                    width: "500",
                    height: "343"
                }
            ];

            // Tạo chỉ số ngẫu nhiên 0, 1 hoặc 2
            var randomIndex = Math.floor(Math.random() * images.length);
            var selectedImage = images[randomIndex];

            var container = document.getElementById("image-container");

            // Tạo thẻ <img> mới và thiết lập các thuộc tính
            var imgElement = document.createElement("img");
            imgElement.src = selectedImage.src;
            imgElement.width = selectedImage.width;
            imgElement.height = selectedImage.height;

            // Xóa nội dung cũ trong container và thêm ảnh mới vào
            container.innerHTML = "";
            container.appendChild(imgElement);
        }
    </script>

</body>
</html>
