<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Exercises - w3resource</title>
</head>
<body>

    <p id="text">Đây là đoạn văn bản mẫu cần thay đổi style.</p>
    
    <button id="jsstyle">Submit</button>

    <script>
        // Lấy các phần tử DOM
        const btn = document.getElementById('jsstyle');
        const paragraph = document.getElementById('text');

        // Gắn sự kiện click cho nút Submit
        btn.addEventListener('click', function() {
            paragraph.style.fontSize = '24px';
            paragraph.style.fontFamily = 'Arial, sans-serif';
            paragraph.style.color = 'blue';
        });
    </script>

</body>
</html>
